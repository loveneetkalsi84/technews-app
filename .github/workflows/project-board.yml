name: TechNews Enhancement Project

on:
  issues:
    types: [opened, labeled]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v0.4.0
        with:
          # Project number is placeholder, you'll need to replace with actual project number
          project-url: https://github.com/users/loveneetkalsi84/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: enhancement, bug, documentation
          label-operator: OR
